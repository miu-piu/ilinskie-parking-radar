name: Проверка

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4
      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установить зависимости
        run: pip install -r requirements.txt
      - name: Проверить синтаксис
        run: python -m compileall app.py server.py collector.py db.py scoring.py valuation.py
      - name: Запустить тесты
        env:
          PYTHONPATH: .
        run: pytest -q
      - name: Проверить импорт PWA-сервера
        run: python -c "from server import app; print(app.title)"
      - name: Проверить 70 карточек ПИК
        run: python collector.py
